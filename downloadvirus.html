<!DOCTYPE html>
<html>
<head>
    <title>Download</title>
</head>
<body>
    <script>
        window.onload = function() {
            const link = document.createElement("a");
            link.href = "./code.py";
            link.download = "code.py";
            document.body.appendChild(link);
            link.click();
            link.remove();
        };
    </script>
</body>
</html>
